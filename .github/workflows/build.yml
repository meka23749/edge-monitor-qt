name: Build Edge Monitor Qt

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-linux:
    name: Build on Linux
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-charts-dev cmake g++

      - name: Build project
        run: |
          cmake -B build -S .
          cmake --build build
          echo "Build successful"

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: C++ static analysis
        run: |
          sudo apt-get install -y cppcheck
          cppcheck --error-exitcode=1 mainwindow.cpp main.cpp
          echo "Code quality OK"
